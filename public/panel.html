<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="查看 Codex 5h 与每周剩余额度，自定义圆环与宠物。"><title>额度伙伴</title><style>/* STYLE */</style></head>
<body>
<main id="panel" tabindex="-1" aria-label="额度伙伴">
  <header><h1>额度伙伴</h1><button id="menuButton" class="icon-button" aria-label="打开菜单" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></header>
  <div id="petStage" class="pet-stage"><button id="petButton" class="pet-button" aria-label="设置自定义宠物"><span id="petImageMount"></span><span id="petEmpty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10 5 4l6 3h2l6-3-2 6c4 9-14 9-10 0Z"/><path d="M9 12h.01M15 12h.01M11 15h2"/></svg><span>添加你的宠物</span></span></button></div>
  <section class="quota" id="fiveHour" tabindex="0" aria-label="5h 剩余额度"><div class="ring"><svg viewBox="0 0 160 160" aria-hidden="true"><circle class="track" cx="80" cy="80" r="68"/><circle class="arc" cx="80" cy="80" r="68" pathLength="100"/></svg><div class="ring-center"><strong class="percentage">--</strong><span>剩余</span></div></div><h2>5h 额度</h2><p class="reset">等待额度数据</p></section>
  <section class="quota" id="weekly" tabindex="0" aria-label="每周剩余额度"><div class="ring"><svg viewBox="0 0 160 160" aria-hidden="true"><circle class="track" cx="80" cy="80" r="68"/><circle class="arc" cx="80" cy="80" r="68" pathLength="100"/></svg><div class="ring-center"><strong class="percentage">--</strong><span>剩余</span></div></div><h2>每周额度</h2><p class="reset">等待额度数据</p></section>
  <footer><button id="expandPanel" class="text-button" hidden>展开面板</button><p id="displayStatus" class="hint" role="status"></p><p id="status" role="status">正在读取额度…</p><button id="refresh" class="text-button">刷新额度</button></footer>
</main>
<div id="menu" role="menu" aria-label="额度伙伴菜单" hidden>
  <button id="togglePet" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10 5 4l6 3h2l6-3-2 6c4 9-14 9-10 0Z"/></svg><span>隐藏宠物</span></button>
  <hr><button id="settingsItem" role="menuitem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1v4l-2 1 2 2v3l3 1 1 3h6l1-3 3-1v-3l2-2-2-1V7l-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg><span>设置…</span></button>
</div>
<dialog id="settings" aria-labelledby="settingsTitle"><form id="settingsForm">
  <div class="dialog-header"><h2 id="settingsTitle">设置</h2><button type="button" id="closeSettings" class="icon-button" aria-label="关闭设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <fieldset><legend>宠物</legend><label class="switch-row" for="petVisible">显示宠物<input id="petVisible" type="checkbox" role="switch"></label><label class="switch-row" for="petPaused">暂停动画<input id="petPaused" type="checkbox" role="switch"></label><label class="file-label" for="petFile">自定义宠物图片或动图</label><input id="petFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><p class="hint">PNG、JPG、WebP 或 GIF，最大 2 MB。素材仅保存在本机。</p><button type="button" id="removePet" class="text-button">移除宠物素材</button></fieldset>
  <fieldset><legend>额度颜色</legend><div class="thresholds"><label for="low">低额度上限（%）<input id="low" type="number" min="0" max="99" required></label><label for="high">中额度上限（%）<input id="high" type="number" min="1" max="100" required></label></div><p class="hint">不超过上限时使用该档颜色，其余使用充足颜色。</p><div id="colorSettings"></div></fieldset>
  <p id="settingsError" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancelSettings">取消</button><button type="submit" class="primary">保存设置</button></div>
</form></dialog>
<noscript><p>请启用 JavaScript 以读取额度和打开设置。</p></noscript>
<script type="module">/* SCRIPT */</script>
</body></html>
